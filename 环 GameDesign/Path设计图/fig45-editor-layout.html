<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
/* Tamaki₃ 示意图共用样式：与 Path设计图 fig01–08 同一套配色 */
:root{
  --bg:#0A0B10; --panel:#12141C; --panel2:#191C25; --line:#2A2E38;
  --ink:#F4EFE9; --paper:#E4D9CB; --red:#FF6242; --amber:#FFC08A;
  --cyan:#5FD3D0; --muted:#9A948C; --faint:#5F5A55;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:760px;overflow:hidden}
body{
  background:radial-gradient(120% 90% at 50% 0%,#141722 0%,#0A0B10 62%);
  color:var(--ink);
  font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  padding:44px 48px 0;
  display:flex;flex-direction:column;
}
.kicker{font-family:"DejaVu Sans Mono",monospace;font-size:12px;letter-spacing:3px;color:var(--cyan)}
h1{font-size:27px;font-weight:700;letter-spacing:.5px;margin-top:8px}
.sub{font-size:14px;color:var(--muted);margin-top:6px}
.body{flex:1;margin-top:24px;position:relative}
.legend{
  position:absolute;left:0;right:0;bottom:34px;height:52px;
  background:var(--panel);border-radius:8px;
  display:flex;align-items:center;gap:26px;padding:0 18px;
}
.legend span{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.note{position:absolute;left:0;bottom:0;font-size:12px;color:var(--faint)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-weight:600;color:var(--muted);font-size:12px;
  letter-spacing:1px;padding:8px 10px;border-bottom:1px solid var(--line);
  font-family:"DejaVu Sans Mono",monospace;text-transform:uppercase;
}
td{padding:9px 10px;border-bottom:1px solid #1D2029;color:var(--paper);vertical-align:top}
td.k{color:var(--ink);font-weight:600;white-space:nowrap}
td .mono{font-family:"DejaVu Sans Mono",monospace;font-size:12px;color:var(--amber)}
td .dim{color:var(--muted)}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;line-height:18px}
.yes{background:rgba(255,98,66,.16);color:#FF9A80}
.no{background:rgba(95,211,208,.13);color:var(--cyan)}
.half{background:rgba(255,192,138,.14);color:var(--amber)}

</style>
<title>编辑器三栏布局</title></head>
<body>
<div class="kicker">TAMAKI₃ / CHARTER</div>
<h1>主窗口：左画布、中检查器、右预览</h1>
<div class="sub">预览宽 340 px 可拖，窗口窄于 1180 px 时自动收起；画布永远是主视区。</div>
<div class="body">
<div style="display:flex;gap:14px;height:440px">
  <!-- 画布 -->
  <div style="flex:1;background:#0E1017;border:1px solid #2A2E38;border-radius:10px;position:relative;overflow:hidden">
    <div style="position:absolute;left:0;top:0;bottom:0;width:34px;background:#12141C;border-right:1px solid #2A2E38"></div>
    <div style="position:absolute;left:34px;top:0;right:0;height:28px;background:#12141C;border-bottom:1px solid #2A2E38"></div>
    <div style="position:absolute;left:34px;top:28px;right:0;bottom:0;
      background-image:linear-gradient(#1D2029 1px,transparent 1px),linear-gradient(90deg,#1D2029 1px,transparent 1px);
      background-size:64px 48px">
      <div style="position:absolute;left:70px;top:60px;width:180px;height:12px;border-radius:6px;background:#FF6242;opacity:.85"></div>
      <div style="position:absolute;left:120px;top:132px;width:120px;height:12px;border-radius:6px;background:#FF6242;opacity:.65"></div>
      <div style="position:absolute;left:88px;top:96px;width:3px;height:120px;background:#5FD3D0;opacity:.7"></div>
      <div style="position:absolute;left:250px;top:48px;right:20px;height:34px;border-radius:6px;background:#FF6242;opacity:.18;border:1px solid #FF6242"></div>
      <div style="position:absolute;left:250px;top:150px;right:40px;height:26px;border-radius:6px;background:#5FD3D0;opacity:.16;border:1px solid #5FD3D0"></div>
    </div>
    <div style="position:absolute;left:46px;bottom:12px;font-family:DejaVu Sans Mono;font-size:11px;color:#9A948C">u 0° → 360°　·　时间向下</div>
    <div style="position:absolute;left:46px;top:6px;font-family:DejaVu Sans Mono;font-size:11px;color:#5FD3D0;letter-spacing:1px">CANVAS　u × 时间</div>
  </div>
  <!-- 检查器 -->
  <div style="width:250px;background:#12141C;border:1px solid #2A2E38;border-radius:10px;padding:12px 12px 0">
    <div style="font-family:DejaVu Sans Mono;font-size:11px;color:#5FD3D0;letter-spacing:1px">INSPECTOR　7 页</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:10px">
      <span style="font-size:11.5px;padding:3px 8px;border-radius:5px;background:#FF6242;color:#0A0B10;font-weight:600">音符</span>
      <span style="font-size:11.5px;padding:3px 8px;border-radius:5px;background:#191C25;color:#9A948C">区域</span>
      <span style="font-size:11.5px;padding:3px 8px;border-radius:5px;background:#191C25;color:#9A948C">边界</span>
      <span style="font-size:11.5px;padding:3px 8px;border-radius:5px;background:#191C25;color:#9A948C">事件</span>
      <span style="font-size:11.5px;padding:3px 8px;border-radius:5px;background:#191C25;color:#9A948C">视图</span>
      <span style="font-size:11.5px;padding:3px 8px;border-radius:5px;background:#191C25;color:#9A948C">时间</span>
      <span style="font-size:11.5px;padding:3px 8px;border-radius:5px;background:#191C25;color:#9A948C">谱面</span>
    </div>
    <div style="margin-top:14px;font-size:12px;color:#9A948C;line-height:1.9">
      <div>角度　<span style="color:#E4D9CB;font-family:DejaVu Sans Mono">45.0°</span></div>
      <div>宽度　<span style="color:#E4D9CB;font-family:DejaVu Sans Mono">60.0°</span></div>
      <div>拍点　<span style="color:#E4D9CB;font-family:DejaVu Sans Mono">32 : 1 : 4</span></div>
      <div>颜色　<span style="color:#FFC08A;font-family:DejaVu Sans Mono">自定义</span></div>
    </div>
  </div>
  <!-- 预览 -->
  <div style="width:340px;background:#0E1017;border:1px solid #2A2E38;border-radius:10px;position:relative">
    <div style="position:absolute;left:0;right:0;top:0;height:26px;background:#12141C;border-bottom:1px solid #2A2E38;
      font-family:DejaVu Sans Mono;font-size:11px;color:#5FD3D0;padding:6px 10px;letter-spacing:1px">PREVIEW　340 px</div>
    <svg viewBox="0 0 300 340" width="340" height="374" style="position:absolute;left:0;top:26px">
      <circle cx="150" cy="176" r="104" fill="none" stroke="#5FD3D0" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="150" cy="176" r="86" fill="none" stroke="#5F5A55" stroke-width="1" stroke-dasharray="4 6"/>
      <rect x="146" y="80" width="9" height="26" rx="4" fill="#FF6242"/>
      <rect x="196" y="140" width="9" height="26" rx="4" fill="#FF6242" opacity=".7" transform="rotate(56 200 153)"/>
      <circle cx="150" cy="192" r="3" fill="#F4EFE9"/>
      <text x="150" y="300" text-anchor="middle" fill="#9A948C" font-family="DejaVu Sans Mono" font-size="10">单光标 · 不吸附</text>
    </svg>
  </div>
</div>
<div class="legend">
  <span><i class="dot" style="background:#FF6242"></i>画布对象</span>
  <span><i class="dot" style="background:#5FD3D0"></i>事件 / 边界</span>
  <span><i class="dot" style="background:#9A948C"></i>可折叠区</span>
</div>
<div class="note">旧版“左预览、中画布、右检查器”已废弃；预览从装饰变成可拖宽的第二视区。</div>
</div>
</body></html>
