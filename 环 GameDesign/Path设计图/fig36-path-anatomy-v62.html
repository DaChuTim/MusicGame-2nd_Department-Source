<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>一个 Path 的构成</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:760px;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 0%,#141722 0%,#0A0B10 62%);color:#F4EFE9;
 font-family:"Noto Sans CJK SC",sans-serif;padding:44px 48px 0;display:flex;flex-direction:column}
.k{font-family:"DejaVu Sans Mono",monospace;font-size:12px;letter-spacing:3px;color:#5FD3D0}
h1{font-size:27px;margin-top:8px}
.sub{font-size:14px;color:#9A948C;margin-top:6px}
.body{flex:1;position:relative}
.legend{position:absolute;left:0;right:0;bottom:34px;height:52px;background:#12141C;border-radius:8px;
 display:flex;align-items:center;gap:26px;padding:0 18px}
.legend span{font-size:13px;display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:3px}
.note{position:absolute;left:0;bottom:0;font-size:12px;color:#5F5A55}
</style></head><body>
<div class="k">TAMAKI₃ / PATH</div>
<h1>一个 Path 的构成</h1>
<div class="sub">头尾放大承担判定，中段只承担跟随；颜色来自配色组的 path 槽，单条音符可以覆盖。</div>
<div class="body">
<svg viewBox="0 0 1100 500" width="1100" height="500">
  <!-- 走廊 -->
  <path d="M 110 400 C 300 380 380 150 620 150 C 800 150 880 250 990 230"
        fill="none" stroke="#5FD3D0" stroke-opacity="0.13" stroke-width="64" stroke-linecap="round"/>
  <!-- 中轴 -->
  <path d="M 110 400 C 300 380 380 150 620 150 C 800 150 880 250 990 230"
        fill="none" stroke="#E4D9CB" stroke-width="10" stroke-linecap="round" opacity=".85"/>
  <!-- 虚线中轴 + 箭头 -->
  <path d="M 110 400 C 300 380 380 150 620 150 C 800 150 880 250 990 230"
        fill="none" stroke="#5FD3D0" stroke-width="2" stroke-dasharray="7 9"/>
  <g fill="#5FD3D0">
    <polygon points="300,352 282,368 306,372"/>
    <polygon points="560,152 542,138 540,164"/>
    <polygon points="860,214 838,206 846,232"/>
  </g>
  <!-- 头 -->
  <circle cx="110" cy="400" r="34" fill="#FF6242"/>
  <circle cx="110" cy="400" r="17" fill="none" stroke="#0A0B10" stroke-width="4" opacity=".85"/>
  <!-- 尾 -->
  <circle cx="990" cy="230" r="26" fill="none" stroke="#FFC08A" stroke-width="7"/>
  <!-- 标签 -->
  <g font-family="DejaVu Sans Mono" font-size="13" letter-spacing="2">
    <text x="110" y="462" fill="#FF6242" text-anchor="middle">HEAD</text>
    <text x="990" y="288" fill="#FFC08A" text-anchor="middle">TAIL</text>
    <text x="560" y="262" fill="#5FD3D0" text-anchor="middle">ARROW + AXIS（同一 path 色）</text>
  </g>
  <!-- 说明框 -->
  <rect x="700" y="330" width="380" height="118" rx="8" fill="#12141C" stroke="#2A2E38"/>
  <text x="720" y="360" fill="#F4EFE9" font-family="Noto Sans CJK SC" font-size="14">配色：tap / hold / path 三个色槽</text>
  <text x="720" y="386" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="12.5">单条音符可用 note_colors 覆盖自己的颜色</text>
  <text x="720" y="410" fill="#9A948C" font-family="Noto Sans CJK SC" font-size="12.5">不再区分头、尾、滑条、方向四个槽位</text>
  <text x="720" y="434" fill="#FFC08A" font-family="DejaVu Sans Mono" font-size="11">只改表现, 不改判定</text>
</svg>
<div class="legend">
  <span><i class="dot" style="background:#FF6242"></i>头：时间 + 逻辑位置</span>
  <span><i class="dot" style="background:#FFC08A"></i>尾：时间 + 逻辑位置</span>
  <span><i class="dot" style="background:#E4D9CB"></i>中段：走廊跟随</span>
  <span><i class="dot" style="background:#5FD3D0"></i>方向辅助</span>
</div>
<div class="note">方向辅助可整体关闭；关闭后只剩纯色滑条，判定不变。</div>
</div>
</body></html>
